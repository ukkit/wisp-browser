<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Wisp mono mark: indigo circle + white wisp glyph.
       This is the "favicon · mono" treatment from wisp_browser_icon_concepts.svg
       (the user-approved concept), re-expressed at a 256x256 viewBox so it can
       stand alone as the icon source. The actual .ico/.png raster export is
       generated by export_ico.py via direct Pillow drawing (sampling this same
       bezier path), not by rasterizing this file, since this dev machine has no
       native libcairo to rasterize SVG with. Keep the two in sync by eye if either
       changes — export_ico.py's SEG_A/SEG_B and transform constants are the
       source of truth for the actual shipped icon. -->
  <circle cx="128" cy="128" r="128" fill="#4F46E5"/>
  <g transform="translate(45.714, 45.714) scale(1.6457)">
    <path d="M 50 88
             C 30 78, 28 56, 46 49
             C 64 42, 66 22, 50 14"
          fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round"/>
  </g>
</svg>
